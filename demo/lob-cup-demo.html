<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<meta name="description" content="Liga amateur de pádel: fixture, resultados, tabla y ranking.">
<title>LOB CUP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   LOB CUP — identidad visual
   Negro + amarillo "volt" + rojo de alerta. Tipografía Archivo (ancha y
   condensada, en itálica para los titulares). Mobile-first (390 px).
   ===================================================================== */
:root {
  --bg: #f2f2ee;
  --surface: #ffffff;
  --surface-2: #e9e9e3;
  --ink: #0b0b0c;
  --mute: #5b5e66;
  --line: #dcdcd5;
  --volt: #d4ff00;
  --volt-ink: #0b0b0c;
  --volt-text: #4d5e00;      /* volt legible sobre fondo claro */
  --hot: #e5372a;
  --ok: #0f9f5a;
  --warn: #b26b00;
  --blue: #2c5bff;
  --hero: #0b0b0c;
  --hero-ink: #f4f5f0;
  --hero-mute: #9aa0a8;
  --shadow: 0 1px 0 rgba(0, 0, 0, .04), 0 8px 24px -16px rgba(0, 0, 0, .25);
  --r: 14px;
  --tab-h: 64px;
  --font: 'Archivo', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0b0d; --surface: #15171b; --surface-2: #1e2127; --ink: #f4f5f0; --mute: #979ca6; --line: #282c33;
    --volt-text: #d4ff00; --hot: #ff5446; --ok: #2fdc84; --warn: #ffb020; --blue: #6b8cff;
    --hero: #000000; --shadow: 0 1px 0 rgba(255, 255, 255, .03); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0b0d; --surface: #15171b; --surface-2: #1e2127; --ink: #f4f5f0; --mute: #979ca6; --line: #282c33;
  --volt-text: #d4ff00; --hot: #ff5446; --ok: #2fdc84; --warn: #ffb020; --blue: #6b8cff;
  --hero: #000000; --shadow: 0 1px 0 rgba(255, 255, 255, .03); color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.4;
  min-height: 100vh; -webkit-tap-highlight-color: transparent; overflow-x: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
a { color: inherit; }
.num, .tab-num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
[hidden] { display: none !important; }

/* ---------- Encabezado ---------- */
.top {
  position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line);
}
.top-in { max-width: 560px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px; min-height: 56px; }
.logo { display: flex; align-items: center; gap: 8px; text-decoration: none; min-width: 0; min-height: 44px; }
.logo svg { width: 34px; height: 34px; flex: none; }
.logo b {
  font-weight: 900; font-style: italic; font-stretch: 75%; font-size: 24px; letter-spacing: -.5px; text-transform: uppercase;
  line-height: 1; white-space: nowrap;
}
.top .sp { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 600; color: var(--mute); white-space: nowrap; }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; flex: none; }
.icon-btn:active { background: var(--surface-2); }
.icon-btn svg { width: 22px; height: 22px; }

/* Barra de demo */
.demo-bar { background: var(--volt); color: var(--volt-ink); }
.demo-in { max-width: 560px; margin: 0 auto; padding: 6px 16px; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; }
.demo-in .tag { font-weight: 900; font-style: italic; letter-spacing: .5px; }
.demo-in select {
  flex: 1; min-width: 0; height: 36px; border-radius: 10px; border: 1.5px solid var(--volt-ink); background: transparent; color: var(--volt-ink);
  padding: 0 8px; font-weight: 700; font-size: 13px;
}
.demo-in select option { color: #0b0b0c; background: #fff; }
.demo-in .icon-btn { width: 40px; height: 36px; border: 1.5px solid var(--volt-ink); border-radius: 10px; }

/* ---------- Contenido ---------- */
main { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(var(--tab-h) + 28px + env(safe-area-inset-bottom)); }
.h1 { font-weight: 900; font-style: italic; font-stretch: 80%; text-transform: uppercase; font-size: 30px; line-height: .95; letter-spacing: -.5px; }
.h2 { font-weight: 900; font-style: italic; font-stretch: 85%; text-transform: uppercase; font-size: 19px; letter-spacing: -.2px; line-height: 1.05; }
.kicker { font-size: 11px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase; color: var(--mute); }
.mute { color: var(--mute); }
.small { font-size: 13px; }
.sec { margin-top: 26px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.sec-h a, .link { font-size: 13px; font-weight: 700; color: var(--volt-text); text-decoration: none; background: none; min-height: 44px; display: inline-flex; align-items: center; }
.saludo { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.saludo p { margin-top: 6px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.card.pad { padding: 16px; }
.stack > * + * { margin-top: 10px; }
.row { display: flex; align-items: center; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Héroe: el momento de marca (siempre negro) */
.hero {
  position: relative; overflow: hidden; background: var(--hero); color: var(--hero-ink); border-radius: 18px; padding: 18px 16px 16px;
  isolation: isolate;
}
.hero::before { /* la parábola del globo */
  content: ""; position: absolute; z-index: -1; right: -70px; top: -120px; width: 300px; height: 260px;
  border: 2px dashed rgba(212, 255, 0, .35); border-radius: 50%; border-left-color: transparent; border-bottom-color: transparent; transform: rotate(-12deg);
}
.hero::after { content: ""; position: absolute; z-index: -1; right: 26px; top: 22px; width: 18px; height: 18px; border-radius: 50%; background: var(--volt); box-shadow: 0 0 0 6px rgba(212, 255, 0, .12); }
.hero .kicker { color: var(--volt); }
.hero .fecha-big { font-weight: 900; font-style: italic; font-stretch: 70%; font-size: 56px; line-height: .85; letter-spacing: -1px; text-transform: uppercase; }
.hero .vs { margin-top: 14px; display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
.hero .vs .lado { min-width: 0; }
.hero .vs .lado b { display: block; font-weight: 800; font-size: 16px; line-height: 1.15; overflow-wrap: anywhere; }
.hero .vs .lado span { font-size: 12px; color: var(--hero-mute); }
.hero .vs .lado.der { text-align: right; }
.hero .vs .x { font-weight: 900; font-style: italic; font-size: 18px; color: var(--volt); }
.hero .chips { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 6px; }
.hero .chip { background: rgba(255, 255, 255, .08); color: var(--hero-ink); border-color: transparent; }
.hero .acciones { margin-top: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.hero .btn.ghost { color: var(--hero-ink); border-color: rgba(255, 255, 255, .22); }

/* Botones */
.btn {
  min-height: 48px; padding: 0 16px; border-radius: 12px; font-weight: 800; font-size: 15px; display: inline-flex; align-items: center; justify-content: center;
  gap: 8px; text-align: center; line-height: 1.1; border: 1.5px solid transparent; text-decoration: none; user-select: none;
  transition: transform .08s ease;
}
.btn:active { transform: scale(.98); }
.btn.volt { background: var(--volt); color: var(--volt-ink); }
.btn.dark { background: var(--ink); color: var(--bg); }
.btn.ghost { border-color: var(--line); background: transparent; }
.btn.hot { background: var(--hot); color: #fff; }
.btn.ok { background: var(--ok); color: #fff; }
.btn.block { width: 100%; }
.btn.sm { min-height: 44px; font-size: 14px; padding: 0 12px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btns.one { grid-template-columns: 1fr; }

/* Chips de estado */
.chip { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid var(--line); white-space: nowrap; }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
.chip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.chip.hot { color: var(--hot); border-color: color-mix(in srgb, var(--hot) 45%, transparent); }
.chip.volt { background: var(--volt); color: var(--volt-ink); border-color: var(--volt); }
.chip.solid { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Filtros (categorías, fechas) */
.filtros { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px 4px; scroll-snap-type: x proximity; }
.filtros::-webkit-scrollbar { display: none; }
.filtros button {
  flex: none; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); font-weight: 800; font-size: 13px; white-space: nowrap; scroll-snap-align: start;
}
.filtros button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { min-height: 40px; border-radius: 9px; font-weight: 800; font-size: 13px; color: var(--mute); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

/* Pendientes */
.pend { display: flex; gap: 12px; padding: 14px; align-items: flex-start; }
.pend .ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; background: var(--surface-2); }
.pend .ico svg { width: 20px; height: 20px; }
.pend.urg .ico { background: var(--volt); color: var(--volt-ink); }
.pend.hot .ico { background: color-mix(in srgb, var(--hot) 16%, transparent); color: var(--hot); }
.pend b { display: block; font-size: 15px; line-height: 1.2; }
.pend p { font-size: 13px; color: var(--mute); margin-top: 3px; }
.pend .btns { margin-top: 10px; }

/* Marcador (sets) */
.marcador { display: grid; grid-template-columns: minmax(0, 1fr) auto; row-gap: 6px; column-gap: 10px; align-items: center; }
.marcador .eq { min-width: 0; font-weight: 700; font-size: 14px; line-height: 1.2; overflow-wrap: anywhere; }
.marcador .eq.gana { font-weight: 900; }
.marcador .eq.gana::after { content: " ●"; color: var(--volt-text); font-size: 10px; vertical-align: middle; }
.marcador .sets { display: flex; gap: 4px; }
.marcador .sets span { width: 28px; height: 30px; border-radius: 7px; display: grid; place-items: center; font-weight: 900; font-size: 16px; background: var(--surface-2); font-variant-numeric: tabular-nums; }
.marcador .sets span.g { background: var(--ink); color: var(--bg); }
.marcador .sets span.stb { font-size: 13px; }

/* Tarjeta de partido */
.partido { padding: 12px 14px; display: block; width: 100%; text-align: left; }
.partido + .partido { border-top: 1px solid var(--line); }
.partido .meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12px; color: var(--mute); font-weight: 700; }
.partido.mio { box-shadow: inset 3px 0 0 var(--volt); }
.lista { overflow: hidden; }

/* Tabla de posiciones */
.tabla { width: 100%; border-collapse: collapse; table-layout: fixed; }
.tabla th { font-size: 11px; font-weight: 800; color: var(--mute); text-align: center; padding: 10px 0; border-bottom: 1px solid var(--line); letter-spacing: .5px; }
.tabla td { padding: 10px 0; text-align: center; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; font-size: 14px; }
.tabla tr:last-child td { border-bottom: 0; }
.tabla th.pos, .tabla td.pos { width: 34px; }
.tabla td.pos { font-weight: 900; font-style: italic; font-size: 17px; }
.tabla th.n, .tabla td.n { width: 30px; }
.tabla th.pts, .tabla td.pts { width: 40px; }
.tabla td.pts { font-weight: 900; font-size: 16px; }
.tabla th.eq, .tabla td.eq { text-align: left; padding-left: 4px; padding-right: 6px; }
.tabla td.eq b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tabla td.eq small { display: block; font-size: 11px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tabla tr.mia td { background: color-mix(in srgb, var(--volt) 22%, transparent); }
.tabla tr.mia td.pos { box-shadow: inset 3px 0 0 var(--volt); }
.tabla tr[data-act] { cursor: pointer; }
.tabla tr.podio1 td.pos { color: var(--volt-text); }

/* Ranking */
.podio { display: grid; grid-template-columns: 1fr 1.15fr 1fr; gap: 8px; align-items: end; }
.podio .p { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 8px; text-align: center; min-width: 0; }
.podio .p.uno { background: var(--hero); color: var(--hero-ink); border-color: var(--hero); padding-top: 18px; }
.podio .p .lugar { font-weight: 900; font-style: italic; font-stretch: 70%; font-size: 34px; line-height: .9; }
.podio .p.uno .lugar { color: var(--volt); font-size: 44px; }
.podio .p b { display: block; font-size: 13px; line-height: 1.15; margin-top: 6px; overflow-wrap: anywhere; }
.podio .p .pts { font-weight: 900; font-size: 18px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.podio .p small { font-size: 11px; opacity: .7; }
.rk-row { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto 52px; gap: 8px; align-items: center; padding: 10px 14px; min-height: 56px; width: 100%; text-align: left; }
.rk-row + .rk-row { border-top: 1px solid var(--line); }
.rk-row .pos { font-weight: 900; font-style: italic; font-size: 17px; text-align: center; }
.rk-row b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rk-row small { display: block; font-size: 12px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rk-row .pts { font-weight: 900; font-size: 17px; text-align: right; font-variant-numeric: tabular-nums; }
.rk-row.yo { background: color-mix(in srgb, var(--volt) 22%, transparent); }
.racha { font-size: 11px; font-weight: 900; padding: 3px 7px; border-radius: 6px; background: var(--surface-2); white-space: nowrap; }
.racha.G { background: var(--volt); color: var(--volt-ink); }
.racha.P { color: var(--hot); }
.ultimos { display: flex; gap: 4px; }
.ultimos i { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-style: normal; font-size: 11px; font-weight: 900; background: var(--surface-2); }
.ultimos i.G { background: var(--volt); color: var(--volt-ink); }

/* Estadísticas */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 12px; padding: 10px 6px; text-align: center; min-width: 0; }
.stat b { display: block; font-weight: 900; font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat span { display: block; font-size: 11px; color: var(--mute); margin-top: 4px; font-weight: 700; }
.hero .stat { background: rgba(255, 255, 255, .07); }
.hero .stat span { color: var(--hero-mute); }

/* Destacados de la fecha */
.dest { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.dest .card { padding: 12px; min-width: 0; }
.dest .card b { display: block; font-size: 14px; margin-top: 4px; line-height: 1.2; overflow-wrap: anywhere; }
.dest .card .big { font-weight: 900; font-style: italic; font-size: 26px; line-height: 1; }
.dest .card.full { grid-column: 1 / -1; }

/* Formularios */
.campo { display: block; }
.campo + .campo { margin-top: 12px; }
.campo span { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
.campo input, .campo select, .campo textarea {
  width: 100%; min-height: 48px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); padding: 10px 12px; font-size: 16px;
}
.campo textarea { min-height: 84px; resize: vertical; }
.campo input:focus, .campo select:focus, .campo textarea:focus { outline: none; border-color: var(--ink); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid2 .campo + .campo { margin-top: 0; }
.ayuda { font-size: 12px; color: var(--mute); margin-top: 6px; }
.error { color: var(--hot); font-weight: 700; font-size: 13px; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 6px 0; }
.switch input { width: 48px; height: 28px; appearance: none; -webkit-appearance: none; background: var(--line); border-radius: 999px; position: relative; flex: none; transition: background .15s; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); }
.switch input:checked { background: var(--ink); }
.switch input:checked::after { transform: translateX(20px); background: var(--volt); }

/* Editor de resultado */
.score { display: grid; grid-template-columns: minmax(0, 1fr) 120px 120px; gap: 8px 6px; align-items: center; }
.score .hd { font-size: 12px; font-weight: 800; text-align: center; color: var(--mute); text-transform: uppercase; letter-spacing: .5px; overflow-wrap: anywhere; }
.score .lbl { font-weight: 800; font-size: 13px; line-height: 1.15; }
.score .lbl small { display: block; font-size: 11px; color: var(--mute); font-weight: 600; }
.step { display: grid; grid-template-columns: 38px 1fr 38px; align-items: center; background: var(--surface-2); border-radius: 12px; height: 48px; }
.step button { height: 48px; font-size: 22px; font-weight: 700; border-radius: 12px; }
.step button:active { background: var(--line); }
.step output { text-align: center; font-weight: 900; font-size: 22px; font-variant-numeric: tabular-nums; }
.score .fila-stb[hidden] { display: none; }
.veredicto { margin-top: 14px; padding: 12px; border-radius: 12px; background: var(--surface-2); font-weight: 800; font-size: 14px; }
.veredicto.ok { background: color-mix(in srgb, var(--volt) 35%, transparent); }
.veredicto.mal { color: var(--hot); }

/* Turnos para reservar */
.dias { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px 6px; }
.dias::-webkit-scrollbar { display: none; }
.dias button { flex: none; width: 58px; min-height: 64px; border-radius: 12px; border: 1.5px solid var(--line); display: grid; place-items: center; padding: 6px 0; line-height: 1.05; }
.dias button small { font-size: 11px; font-weight: 700; color: var(--mute); text-transform: uppercase; }
.dias button b { font-size: 20px; font-weight: 900; }
.dias button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.dias button.on small { color: var(--bg); opacity: .7; }
.slots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.slot { min-height: 60px; border-radius: 12px; border: 1.5px solid var(--line); padding: 8px 10px; text-align: left; }
.slot b { display: block; font-size: 16px; font-weight: 900; font-variant-numeric: tabular-nums; }
.slot small { font-size: 12px; color: var(--mute); font-weight: 700; }
.slot.on { border-color: var(--ink); background: var(--volt); color: var(--volt-ink); }
.slot.on small { color: var(--volt-ink); }
.slot[disabled] { opacity: .4; }

/* Barra de pestañas */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
.tabs-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--tab-h); }
.tabs button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 800; color: var(--mute); position: relative; min-width: 0; }
.tabs button svg { width: 24px; height: 24px; }
.tabs button.on { color: var(--ink); }
.tabs button.on::before { content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--volt); }

<div id="app"></div>
<div id="capa"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script>
"use strict";
const __logica = (() => {
// =====================================================================
// Reglas de la liga (funciones puras, sin pantalla ni base de datos).
// Son LAS MISMAS reglas que calcula Postgres en supabase/schema.sql
// (tabla_categoria, ranking_jugadores). Si cambiás una, cambiá la otra
// y corré: node tests/logica.test.mjs
// =====================================================================

const CONFIG_BASE = {
  temporada: 'Temporada 2027',
  puntos_victoria: 1,          // tabla por pareja: 1 punto por partido ganado (como la liga actual)
  puntos_derrota: 0,
  rk_gana_2sets: 100,          // ranking individual (Puntos LOB)
  rk_gana_stb: 80,
  rk_pierde_stb: 40,
  rk_pierde_2sets: 20,
  rk_wo_favor: 100,
  rk_wo_contra: -30,
  horas_autoconfirmar: 24,
  valor_turno: 36000,
  monto_sena: 9000,
  alias: 'lobcup.liga',
  ventana_dias: 14,
};

// --------------------------------------------------------------------
// Sets
// --------------------------------------------------------------------
// Sets 1 y 2: 6-0 a 6-4, 7-5 o 7-6. Set 3: súper tie-break a 11, diferencia de 2
// (11-9, 12-10, 13-11...).
function setValido(a, b, n) {
  if (!Number.isInteger(a) || !Number.isInteger(b) || a < 0 || b < 0 || a === b) return false;
  const g = Math.max(a, b), p = Math.min(a, b);
  if (n === 3) return g >= 11 && g - p >= 2 && (g === 11 || g - p === 2);
  return (g === 6 && p <= 4) || (g === 7 && (p === 5 || p === 6));
}

// sets: [[a,b],[a,b],[a,b]?] desde el punto de vista de la pareja A.
// Devuelve { ok, error, ganador: 'a'|'b', stb }
function validarSets(sets) {
  const s = (sets || []).filter((x) => x && x[0] !== '' && x[0] != null && x[1] !== '' && x[1] != null)
    .map((x) => [Number(x[0]), Number(x[1])]);
  if (s.length < 2) return { ok: false, error: 'Cargá al menos los dos primeros sets.' };
  for (let i = 0; i < 2; i++) {
    if (!setValido(s[i][0], s[i][1], i + 1)) return { ok: false, error: `El set ${i + 1} (${s[i][0]}-${s[i][1]}) no es válido. Va de 6-0 a 6-4, 7-5 o 7-6.` };
  }
  const g1 = s[0][0] > s[0][1] ? 'a' : 'b', g2 = s[1][0] > s[1][1] ? 'a' : 'b';
  if (g1 === g2) {
    if (s.length > 2) return { ok: false, error: 'Si una pareja ganó los dos primeros sets, no hay súper tie-break.' };
    return { ok: true, ganador: g1, stb: false, sets: s };
  }
  if (s.length < 3) return { ok: false, error: 'Van 1 set a 1: falta el súper tie-break.' };
  if (!setValido(s[2][0], s[2][1], 3)) return { ok: false, error: `El súper tie-break (${s[2][0]}-${s[2][1]}) no es válido. Es a 11 con diferencia de 2 (11-9, 12-10...).` };
  return { ok: true, ganador: s[2][0] > s[2][1] ? 'a' : 'b', stb: true, sets: s.slice(0, 3) };
}

const SETS_WO = [[6, 0], [6, 0]];

// Sets y games de un partido para la pareja A y la B.
// Igual que la liga actual: los puntos del súper tie-break suman como games.
function contarSets(sets) {
  let sa = 0, sb = 0, ga = 0, gb = 0;
  for (const [a, b] of sets || []) { ga += a; gb += b; if (a > b) sa++; else sb++; }
  return { sa, sb, ga, gb };
}

// Sets dados vuelta (para mostrarlos desde el lado de la pareja B).
const invertirSets = (sets) => (sets || []).map(([a, b]) => [b, a]);
const textoSets = (sets) => (sets || []).map(([a, b]) => `${a}-${b}`).join('  ');

// --------------------------------------------------------------------
// Tabla de posiciones por categoría (por pareja)
// Orden: 1) puntos 2) dif. sets 3) dif. games 4) enfrentamiento directo
//        (partidos ganados entre las empatadas) 5) orden de inscripción (id)
// Solo cuentan partidos CONFIRMADOS. Parejas dadas de baja no aparecen,
// pero lo que jugaron contra las demás sigue contando.
// --------------------------------------------------------------------
function calcularTabla(parejas, partidos, cfg = CONFIG_BASE) {
  const st = new Map();
  for (const p of parejas) {
    if (p.estado !== 'activa' || !p.jugador2) continue;   // sin compañero todavía no juega
    st.set(p.id, { id: p.id, pj: 0, pg: 0, pp: 0, pts: 0, sf: 0, sc: 0, gf: 0, gc: 0, h2h: new Map() });
  }
  for (const m of partidos) {
    if (m.estado !== 'confirmado' || !m.ganador) continue;
    const { sa, sb, ga, gb } = contarSets(m.sets);
    const A = st.get(m.a), B = st.get(m.b);
    const ganoA = m.ganador === m.a;
    if (A) {
      A.pj++; A.sf += sa; A.sc += sb; A.gf += ga; A.gc += gb;
      if (ganoA) { A.pg++; A.pts += cfg.puntos_victoria; A.h2h.set(m.b, (A.h2h.get(m.b) || 0) + 1); } else { A.pp++; A.pts += cfg.puntos_derrota; }
    }
    if (B) {
      B.pj++; B.sf += sb; B.sc += sa; B.gf += gb; B.gc += ga;
      if (!ganoA) { B.pg++; B.pts += cfg.puntos_victoria; B.h2h.set(m.a, (B.h2h.get(m.a) || 0) + 1); } else { B.pp++; B.pts += cfg.puntos_derrota; }
    }
  }
  const filas = [...st.values()].map((r) => ({ ...r, ds: r.sf - r.sc, dg: r.gf - r.gc }));
  const clave = (r) => `${r.pts}|${r.ds}|${r.dg}`;
  // Enfrentamiento directo: partidos ganados contra las otras del mismo grupo de empate.
  for (const r of filas) {
    const grupo = filas.filter((o) => o !== r && clave(o) === clave(r));
    r.dir = grupo.reduce((n, o) => n + (r.h2h.get(o.id) || 0), 0);
  }
  filas.sort((x, y) => y.pts - x.pts || y.ds - x.ds || y.dg - x.dg || y.dir - x.dir || cmpId(x.id, y.id));
  return filas.map((r, i) => {
    const prev = filas[i - 1];
    let desempate = null;
    if (prev && prev.pts === r.pts) {
      desempate = prev.ds !== r.ds ? 'dif. de sets' : prev.dg !== r.dg ? 'dif. de games' : prev.dir !== r.dir ? 'enfrentamiento directo' : 'orden de inscripción';
    }
    const { h2h, ...resto } = r;
    return { pos: i + 1, ...resto, desempate };
  });
}

function cmpId(a, b) {
  const na = Number(a), nb = Number(b);
  if (!Number.isNaN(na) && !Number.isNaN(nb)) return na - nb;
  return String(a).localeCompare(String(b));
}

// --------------------------------------------------------------------
// Puntos LOB (ranking individual)
// --------------------------------------------------------------------
function puntosPartido(m, lado, cfg = CONFIG_BASE) {
  const gano = m.ganador === (lado === 'a' ? m.a : m.b);
  if (m.wo) return gano ? cfg.rk_wo_favor : cfg.rk_wo_contra;
  const stb = (m.sets || []).length >= 3;
  if (gano) return stb ? cfg.rk_gana_stb : cfg.rk_gana_2sets;
  return stb ? cfg.rk_pierde_stb : cfg.rk_pierde_2sets;
}

// Orden cronológico de un partido confirmado (fecha del fixture y después cuándo se confirmó).
const ordenCrono = (x, y) => x.fecha - y.fecha || (x.confirmado_at || 0) - (y.confirmado_at || 0) || cmpId(x.id, y.id);

// Ranking de jugadores. Orden: puntos, ganados, dif. sets, dif. games, nombre.
function calcularRanking(jugadores, parejas, partidos, cfg = CONFIG_BASE) {
  const parejaDe = new Map(parejas.map((p) => [p.id, p]));
  const st = new Map(jugadores.map((j) => [j.id, { id: j.id, nombre: j.nombre, pts: 0, pj: 0, pg: 0, pp: 0, sf: 0, sc: 0, gf: 0, gc: 0, historial: [] }]));
  const conf = partidos.filter((m) => m.estado === 'confirmado' && m.ganador).sort(ordenCrono);
  for (const m of conf) {
    const { sa, sb, ga, gb } = contarSets(m.sets);
    for (const lado of ['a', 'b']) {
      const p = parejaDe.get(m[lado]);
      if (!p) continue;
      const gano = m.ganador === m[lado];
      const pts = puntosPartido(m, lado, cfg);
      for (const jid of [p.jugador1, p.jugador2]) {
        const r = jid && st.get(jid);
        if (!r) continue;
        r.pj++; if (gano) r.pg++; else r.pp++;
        r.pts += pts;
        r.sf += lado === 'a' ? sa : sb; r.sc += lado === 'a' ? sb : sa;
        r.gf += lado === 'a' ? ga : gb; r.gc += lado === 'a' ? gb : ga;
        r.historial.push(gano ? 'G' : 'P');
      }
    }
  }
  const filas = [...st.values()].map((r) => ({ ...r, ds: r.sf - r.sc, dg: r.gf - r.gc, racha: racha(r.historial), ultimos: r.historial.slice(-5) }));
  filas.sort((x, y) => y.pts - x.pts || y.pg - x.pg || y.ds - x.ds || y.dg - x.dg || x.nombre.localeCompare(y.nombre, 'es'));
  return filas.map((r, i) => ({ pos: i + 1, ...r }));
}

// Racha actual: { tipo: 'G'|'P', n } o null.
function racha(historial) {
  if (!historial.length) return null;
  const tipo = historial[historial.length - 1];
  let n = 0;
  for (let i = historial.length - 1; i >= 0 && historial[i] === tipo; i--) n++;
  return { tipo, n };
}

// --------------------------------------------------------------------
// Fixture: todos contra todos, método del círculo (igual que la liga actual).
// Devuelve [[{a,b},...], ...] (una lista por fecha). Si son impares, una queda libre.
// --------------------------------------------------------------------
function roundRobin(ids) {
  const arr = ids.slice();
  if (arr.length % 2) arr.push(null);
  const n = arr.length, rondas = [];
  for (let r = 0; r < n - 1; r++) {
    const ronda = [];
    for (let i = 0; i < n / 2; i++) {
      const a = arr[i], b = arr[n - 1 - i];
      if (a != null && b != null) ronda.push({ a, b });
    }
    rondas.push(ronda);
    const ultimo = arr[n - 1];
    for (let j = n - 1; j > 1; j--) arr[j] = arr[j - 1];
    arr[1] = ultimo;
  }
  return rondas;
}

// --------------------------------------------------------------------
// Auto-confirmación: resultados "por confirmar" vencidos pasan a confirmados.
// --------------------------------------------------------------------
function vencidos(partidos, ahora = Date.now()) {
  return partidos.filter((m) => m.estado === 'por_confirmar' && m.vence_at && m.vence_at <= ahora);
}

// --------------------------------------------------------------------
// WhatsApp: celular argentino → link wa.me
// --------------------------------------------------------------------
function numeroWhatsApp(tel) {
  let d = String(tel || '').replace(/\D/g, '');
  if (!d) return '';
  if (d.startsWith('549')) return d;
  if (d.startsWith('54')) return '549' + d.slice(2);
  if (d.startsWith('0')) d = d.slice(1);
  d = d.replace(/^(\d{2,4})15(\d{6,8})$/, '$1$2'); // 0351 15 xxxxxxx
  if (d.length === 7) d = '351' + d;               // sin característica → Córdoba
  return '549' + d;
}
function linkWhatsApp(tel, texto = '') {
  const n = numeroWhatsApp(tel);
  return n ? `https://wa.me/${n}${texto ? '?text=' + encodeURIComponent(texto) : ''}` : '';
}

// --------------------------------------------------------------------
// Resumen de una fecha: lo más destacado.
// --------------------------------------------------------------------
function resumenFecha(partidos, fecha) {
  const conf = partidos.filter((m) => m.fecha === fecha && m.estado === 'confirmado' && !m.wo);
  const total = partidos.filter((m) => m.fecha === fecha).length;
  let paliza = null, partidazo = null;
  for (const m of conf) {
    const { ga, gb } = contarSets(m.sets);
    const dif = Math.abs(ga - gb);
    const stb = m.sets.length >= 3;
    if (!stb && (!paliza || dif > paliza.dif)) paliza = { partido: m, dif };
    if (stb) {
      const [x, y] = m.sets[2];
      const ajuste = Math.abs(x - y);
      if (!partidazo || ajuste < partidazo.ajuste) partidazo = { partido: m, ajuste };
    }
  }
  return { fecha, jugados: partidos.filter((m) => m.fecha === fecha && m.estado === 'confirmado').length, total, paliza, partidazo, stbs: conf.filter((m) => m.sets.length >= 3).length };
}

// Fecha local AAAA-MM-DD (para reservas).
const fechaISO = (ms) => { const d = new Date(ms); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };

return { CONFIG_BASE, setValido, validarSets, SETS_WO, contarSets, invertirSets, textoSets, calcularTabla, puntosPartido, calcularRanking, racha, roundRobin, vencidos, numeroWhatsApp, linkWhatsApp, resumenFecha, fechaISO };
})();

const __datos_demo = (() => {
// =====================================================================
// Modo DEMO: la liga entera vive en memoria (y en localStorage si se puede).
// Hace las mismas validaciones que las funciones de supabase/schema.sql,
// así lo que se ve en la demo es lo que va a pasar con la base real.
// Todos los nombres y teléfonos son INVENTADOS.
// =====================================================================
const { CONFIG_BASE, validarSets, SETS_WO, roundRobin, vencidos, fechaISO } = __logica;
const CLAVE = 'lobcup-demo-v1';
const HORA = 3600e3, DIA = 24 * HORA;

const NOMBRES_M = ['Tomás', 'Bruno', 'Joaquín', 'Facundo', 'Nicolás', 'Matías', 'Lucas', 'Santiago', 'Franco', 'Agustín', 'Ignacio', 'Martín',
  'Gonzalo', 'Emiliano', 'Federico', 'Julián', 'Lautaro', 'Ramiro', 'Valentín', 'Iván', 'Diego', 'Pablo', 'Rodrigo', 'Leandro'];
const NOMBRES_F = ['Sofía', 'Valentina', 'Camila', 'Lucía', 'Martina', 'Julieta', 'Florencia', 'Agustina', 'Micaela', 'Carolina', 'Paula', 'Victoria',
  'Rocío', 'Belén', 'Milagros', 'Emilia', 'Daniela', 'Natalia', 'Romina', 'Celeste', 'Josefina', 'Candela', 'Pilar', 'Abril'];
const APELLIDOS = ['Arce', 'Villalba', 'Ferreyra', 'Bustamante', 'Peralta', 'Ledesma', 'Correa', 'Molina', 'Vera', 'Ojeda', 'Funes', 'Paz',
  'Godoy', 'Rivas', 'Toledo', 'Acosta', 'Maldonado', 'Herrera', 'Navarro', 'Ponce', 'Rojas', 'Benítez', 'Cáceres', 'Aguirre',
  'Luna', 'Moreno', 'Figueroa', 'Castro', 'Vega', 'Suárez', 'Juárez', 'Gallardo', 'Miranda', 'Lucero', 'Bravo', 'Cabrera',
  'Heredia', 'Ríos', 'Ortiz', 'Agüero', 'Montes', 'Salinas', 'Torres', 'Bazán', 'Campos', 'Guzmán', 'Olmos', 'Barrera'];

const CATEGORIAS_BASE = [
  { id: 1, nombre: '6.ª Masculino', nivel: 6, genero: 'M', orden: 1 },
  { id: 2, nombre: '7.ª Masculino', nivel: 7, genero: 'M', orden: 2 },
  { id: 3, nombre: '8.ª Masculino', nivel: 8, genero: 'M', orden: 3 },
  { id: 4, nombre: '6.ª Femenino', nivel: 6, genero: 'F', orden: 4 },
  { id: 5, nombre: '7.ª Femenino', nivel: 7, genero: 'F', orden: 5 },
  { id: 6, nombre: '8.ª Femenino', nivel: 8, genero: 'F', orden: 6 },
];

// Grilla de la liga actual (sin las mañanas de martes y jueves; con sábado a la tarde y 22:30 a 00:00).
const TURNOS_BASE = (() => {
  const t = []; let id = 0;
  for (let dia = 1; dia <= 5; dia++) {
    for (const [inicio, fin, canchas] of [['18:00', '19:30', 2], ['19:30', '21:00', 2], ['21:00', '22:30', 3], ['22:30', '24:00', 3]]) t.push({ id: ++id, dia, inicio, fin, canchas });
  }
  for (const [inicio, fin] of [['09:30', '11:00'], ['11:00', '12:30'], ['16:00', '17:30'], ['17:30', '19:00']]) t.push({ id: ++id, dia: 6, inicio, fin, canchas: 3 });
  return t;
})();

function prng(semilla) {
  let a = semilla >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}


// ---------------------------------------------------------------------
// Liga de ejemplo: 6 categorías × 8 parejas = 48 parejas, fixture de 7 fechas,
// fechas 1 a 4 jugadas, la 5 a medias, el resto por jugar.
// ---------------------------------------------------------------------
function generarLiga(ahora = Date.now()) {
  const r = prng(20270314);
  const elegir = (arr) => arr[Math.floor(r() * arr.length)];
  const jugadores = [], parejas = [], partidos = [], reservas = [], actividad = [];
  let jid = 0, pid = 0, mid = 0, rid = 0, aid = 0;
  const fuerza = new Map();
  for (const cat of CATEGORIAS_BASE) {
    const nombres = cat.genero === 'M' ? NOMBRES_M : NOMBRES_F;
    for (let k = 0; k < 8; k++) {
      const par = [];
      for (let s = 0; s < 2; s++) {
        const i = ((cat.id - 1) % 3) * 16 + k * 2 + s;         // 48 combinaciones distintas por género
        const ape = APELLIDOS[(i + (cat.genero === 'F' ? 7 : 0)) % APELLIDOS.length];
        jid++;
        jugadores.push({ id: 'j' + jid, nombre: nombres[i % nombres.length], apellido: ape, telefono: '351000' + String(1000 + jid).slice(-4), genero: cat.genero, rol: 'jugador' });
        par.push('j' + jid);
      }
      pid++;
      parejas.push({ id: pid, categoria_id: cat.id, jugador1: par[0], jugador2: par[1], estado: 'activa', creado_at: ahora - 60 * DIA + pid * 1000 });
      fuerza.set(pid, r());
    }
  }
  // Organizador
  jugadores.push({ id: 'org', nombre: 'Organización', apellido: '', telefono: '3510000000', genero: null, rol: 'organizador' });

  const YO = 'j17', MI_PAREJA = 9;                 // Lautaro Maldonado · 7.ª Masculino (pareja 9 con Ramiro Herrera)
  const inicioFecha = (f) => ahora - (5 - f) * 7 * DIA - 2 * DIA;   // fecha 5 = esta semana
  const SETS_GANA = [[6, 0], [6, 1], [6, 2], [6, 3], [6, 4], [6, 4], [7, 5], [7, 6], [6, 3], [6, 2]];
  const setGanado = (ganaA) => { const [x, y] = elegir(SETS_GANA); return ganaA ? [x, y] : [y, x]; };
  function resultado(a, b) {
    const pa = 0.5 + (fuerza.get(a) - fuerza.get(b)) * 0.6;
    const ganaA = r() < pa;
    if (r() < 0.68) return { ganaA, sets: [setGanado(ganaA), setGanado(ganaA)] };
    const primero = r() < 0.5;
    const s3 = r() < 0.85 ? [11, Math.floor(r() * 10)] : [12, 10];
    return { ganaA, sets: [setGanado(primero ? ganaA : !ganaA), setGanado(primero ? !ganaA : ganaA), ganaA ? s3 : [s3[1], s3[0]]] };
  }

  for (const cat of CATEGORIAS_BASE) {
    const ids = parejas.filter((p) => p.categoria_id === cat.id).map((p) => p.id);
    roundRobin(ids).forEach((ronda, i) => {
      const fecha = i + 1;
      ronda.forEach(({ a, b }, j) => {
        mid++;
        const m = { id: mid, categoria_id: cat.id, fecha, a, b, estado: 'pendiente', sets: [], wo: false, ganador: null,
          cargado_por: null, cargado_pareja: null, cargado_at: null, vence_at: null, confirmado_por: null, confirmado_at: null,
          confirmado_via: null, disputa_motivo: null, disputa_sets: null, disputa_por: null, disputa_at: null, editado_por_org: false };
        const dia = inicioFecha(fecha) + j * 0.7 * DIA;
        const jugado = fecha <= 4 || (fecha === 5 && j < 2);
        if (jugado) {
          const res = resultado(a, b);
          const cargo = res.ganaA ? a : b;
          Object.assign(m, { estado: 'confirmado', sets: res.sets, ganador: res.ganaA ? a : b, cargado_pareja: cargo,
            cargado_por: parejas.find((p) => p.id === cargo).jugador1, cargado_at: dia + 2 * HORA, vence_at: dia + 26 * HORA,
            confirmado_at: dia + (r() < 0.8 ? 5 : 26) * HORA, confirmado_via: 'rival' });
          m.confirmado_via = m.confirmado_at - m.cargado_at >= 24 * HORA ? 'auto' : 'rival';
          const rival = cargo === a ? b : a;
          m.confirmado_por = m.confirmado_via === 'rival' ? parejas.find((p) => p.id === rival).jugador2 : null;
        }
        if (fecha >= 5 && fecha <= 6 && !jugado) {
          // Algunas reservas hechas para esta semana y la que viene
          if (r() < 0.55 && !(m.a === MI_PAREJA || m.b === MI_PAREJA)) {
            const base = new Date(ahora + (fecha === 5 ? 1 : 6) * DIA + j * DIA);
            const dow = base.getDay();
            const opciones = TURNOS_BASE.filter((t) => t.dia === dow);
            const fISO = fechaISO(base.getTime());
            const t = opciones.length ? opciones[j % opciones.length] : null;
            const libre = t && [...Array(t.canchas).keys()].map((k) => k + 1).find((c) => !reservas.some((x) => x.fecha === fISO && x.inicio === t.inicio && x.cancha === c));
            if (t && libre) {
              rid++;
              reservas.push({ id: rid, partido_id: mid, fecha: fechaISO(base.getTime()), inicio: t.inicio, fin: t.fin, cancha: libre,
                estado: r() < 0.5 ? 'confirmada' : 'pendiente', creada_por: parejas.find((p) => p.id === a).jugador1, creada_at: ahora - DIA });
            }
          }
        }
        partidos.push(m);
      });
    });
  }

  // Escenas armadas para mostrar el flujo:
  const enCat = (c) => partidos.filter((m) => m.categoria_id === c);
  const mios = partidos.filter((m) => m.a === MI_PAREJA || m.b === MI_PAREJA);
  const rivalDe = (m) => (m.a === MI_PAREJA ? m.b : m.a);
  // 1) Mi fecha 5: el rival cargó el resultado y me toca confirmar.
  const m5 = mios.find((m) => m.fecha === 5);
  if (m5) {
    const res = resultado(m5.a, m5.b);
    const riv = rivalDe(m5);
    Object.assign(m5, { estado: 'por_confirmar', sets: res.sets, ganador: res.ganaA ? m5.a : m5.b, cargado_pareja: riv,
      cargado_por: parejas.find((p) => p.id === riv).jugador1, cargado_at: ahora - 3 * HORA, vence_at: ahora + 21 * HORA,
      confirmado_at: null, confirmado_via: null, confirmado_por: null });
  }
  // 2) Una disputa en mi categoría para que la resuelva el organizador.
  const disp = enCat(2).find((m) => m.fecha === 5 && m.estado === 'pendiente' && m !== m5);
  if (disp) for (let i = reservas.length - 1; i >= 0; i--) if (reservas[i].partido_id === disp.id) reservas.splice(i, 1);
  if (disp) {
    const quien = disp.a;
    Object.assign(disp, { estado: 'en_disputa', sets: [[6, 4], [3, 6], [11, 8]], ganador: disp.a, cargado_pareja: quien,
      cargado_por: parejas.find((p) => p.id === quien).jugador1, cargado_at: ahora - 20 * HORA, vence_at: ahora + 4 * HORA,
      disputa_motivo: 'El súper tie-break terminó 11-9 para nosotros, no 11-8 para ellos.', disputa_sets: [[6, 4], [3, 6], [9, 11]],
      disputa_por: parejas.find((p) => p.id === disp.b).jugador1, disputa_at: ahora - 18 * HORA });
  }
  // 3) Otros resultados esperando confirmación en otras categorías.
  for (const c of [1, 4, 6]) {
    const m = enCat(c).find((x) => x.fecha === 5 && x.estado === 'pendiente');
    if (m) {
      const res = resultado(m.a, m.b); const cargo = res.ganaA ? m.a : m.b;
      Object.assign(m, { estado: 'por_confirmar', sets: res.sets, ganador: cargo, cargado_pareja: cargo,
        cargado_por: parejas.find((p) => p.id === cargo).jugador1, cargado_at: ahora - 10 * HORA, vence_at: ahora + 14 * HORA });
    }
  }
  // 4) Una pareja esperando compañero (inscripción abierta) en 8.ª Femenino.
  jid++;
  jugadores.push({ id: 'j' + jid, nombre: 'Clara', apellido: 'Sarmiento', telefono: '351000' + String(1000 + jid).slice(-4), genero: 'F', rol: 'jugador' });
  pid++;
  parejas.push({ id: pid, categoria_id: 6, jugador1: 'j' + jid, jugador2: null, estado: 'activa', codigo: 'LOB7K2', creado_at: ahora - DIA });

  for (const m of partidos.filter((x) => x.estado !== 'pendiente').sort((x, y) => (x.cargado_at || 0) - (y.cargado_at || 0)).slice(-25)) {
    actividad.push({ id: ++aid, at: m.cargado_at, actor: m.cargado_por, tipo: 'resultado_cargado', partido_id: m.id, detalle: { sets: m.sets } });
    if (m.estado === 'confirmado') actividad.push({ id: ++aid, at: m.confirmado_at, actor: m.confirmado_por, tipo: m.confirmado_via === 'auto' ? 'resultado_autoconfirmado' : 'resultado_confirmado', partido_id: m.id, detalle: {} });
    if (m.estado === 'en_disputa') actividad.push({ id: ++aid, at: m.disputa_at, actor: m.disputa_por, tipo: 'resultado_disputado', partido_id: m.id, detalle: { motivo: m.disputa_motivo } });
  }
  actividad.sort((x, y) => y.at - x.at);

  return {
    version: 1,
    config: { ...CONFIG_BASE, whatsapp_org: '3510000000' },
    categorias: CATEGORIAS_BASE.map((c) => ({ ...c, inscripcion_abierta: true, fecha_en_juego: null })),
    jugadores, parejas, partidos, turnos: TURNOS_BASE.map((t) => ({ ...t })), reservas, actividad,
    yo: YO, ids: { jid, pid, mid, rid, aid },
  };
}

function leerGuardado() {
  try { const t = localStorage.getItem(CLAVE); if (t) { const d = JSON.parse(t); if (d && d.version === 1) return d; } } catch (e) { /* sin localStorage */ }
  return null;
}
function guardar(db) { try { localStorage.setItem(CLAVE, JSON.stringify(db)); } catch (e) { /* sin localStorage: queda en memoria */ } }

function crearDemo() {
  let db = leerGuardado() || generarLiga();
  const fallar = (msg) => { throw new Error(msg); };
  const ahora = () => Date.now();
  const yo = () => db.yo;
  const esOrg = () => (db.jugadores.find((j) => j.id === db.yo) || {}).rol === 'organizador';
  const partido = (id) => db.partidos.find((m) => m.id === Number(id)) || fallar('Ese partido no existe.');
  const pareja = (id) => db.parejas.find((p) => p.id === id);
  const miParejaEn = (m, uid = yo()) => [m.a, m.b].find((id) => { const p = pareja(id); return p && (p.jugador1 === uid || p.jugador2 === uid); }) || null;
  const log = (tipo, partido_id, detalle = {}, actor = yo()) => { db.actividad.unshift({ id: ++db.ids.aid, at: ahora(), actor, tipo, partido_id, detalle }); db.actividad = db.actividad.slice(0, 300); };
  const soloOrg = () => { if (!esOrg()) fallar('Solo el organizador.'); };
  const fin = () => { guardar(db); return true; };

  function autoconfirmar() {
    const v = vencidos(db.partidos, ahora());
    for (const m of v) { Object.assign(m, { estado: 'confirmado', confirmado_at: ahora(), confirmado_via: 'auto', confirmado_por: null }); log('resultado_autoconfirmado', m.id, {}, null); }
    if (v.length) guardar(db);
    return v.length;
  }

  function cargarResultado(id, sets, wo = false, uid = yo()) {
    const m = partido(id);
    const mi = miParejaEn(m, uid);
    if (!mi) fallar('Solo pueden cargar el resultado los que juegan el partido.');
    if ([m.a, m.b].some((p) => pareja(p).estado !== 'activa')) fallar('Una de las parejas está dada de baja. Lo resuelve el organizador.');
    if (m.estado === 'confirmado') fallar('Este resultado ya está confirmado. Si hay un error, avisale al organizador.');
    if (m.estado === 'en_disputa') fallar('Este resultado está en revisión del organizador.');
    if (m.estado === 'por_confirmar' && m.cargado_pareja !== mi) fallar('Tu rival ya cargó el resultado: confirmalo o marcá que no es así.');
    let ganador;
    if (wo) { sets = mi === m.a ? SETS_WO.map((s) => [...s]) : SETS_WO.map(([x, y]) => [y, x]); ganador = mi; }
    else { const v = validarSets(sets); if (!v.ok) fallar(v.error); sets = v.sets; ganador = v.ganador === 'a' ? m.a : m.b; }
    Object.assign(m, { estado: 'por_confirmar', sets, wo: !!wo, ganador, cargado_por: uid, cargado_pareja: mi, cargado_at: ahora(),
      vence_at: ahora() + db.config.horas_autoconfirmar * HORA, confirmado_por: null, confirmado_at: null, confirmado_via: null,
      disputa_motivo: null, disputa_sets: null, disputa_por: null, disputa_at: null });
    log(wo ? 'wo_cargado' : 'resultado_cargado', m.id, { sets }, uid);
    return fin();
  }
  function confirmarResultado(id, uid = yo()) {
    const m = partido(id);
    if (m.estado !== 'por_confirmar') fallar('Este resultado no está esperando confirmación.');
    const mi = miParejaEn(m, uid);
    if (!mi || mi === m.cargado_pareja) fallar('Lo confirma la pareja rival de la que lo cargó.');
    Object.assign(m, { estado: 'confirmado', confirmado_por: uid, confirmado_at: ahora(), confirmado_via: 'rival' });
    log('resultado_confirmado', m.id, {}, uid);
    return fin();
  }
  function disputarResultado(id, motivo, sets = null, uid = yo()) {
    const m = partido(id);
    if (m.estado !== 'por_confirmar') fallar('Este resultado no está esperando confirmación.');
    const mi = miParejaEn(m, uid);
    if (!mi || mi === m.cargado_pareja) fallar('Lo puede objetar la pareja rival de la que lo cargó.');
    let propuesta = null;
    if (sets && sets.some((s) => s && s[0] !== '' && s[0] != null)) { const v = validarSets(sets); if (!v.ok) fallar(v.error); propuesta = v.sets; }
    Object.assign(m, { estado: 'en_disputa', disputa_motivo: String(motivo || '').slice(0, 300), disputa_sets: propuesta, disputa_por: uid, disputa_at: ahora() });
    log('resultado_disputado', m.id, { motivo }, uid);
    return fin();
  }
  function reservarTurno(id, fecha, inicio, uid = yo()) {
    const m = partido(id);
    if (!miParejaEn(m, uid) && !esOrg()) fallar('Solo reservan los que juegan el partido.');
    if (m.estado === 'confirmado') fallar('Este partido ya se jugó.');
    const hoy = fechaISO(ahora());
    const max = fechaISO(ahora() + db.config.ventana_dias * DIA);
    if (fecha < hoy || fecha > max) fallar(`Se reserva de hoy a ${db.config.ventana_dias} días.`);
    if (new Date(`${fecha}T${inicio}:00`).getTime() <= ahora()) fallar('Ese horario ya pasó.');
    const dow = new Date(`${fecha}T12:00:00`).getDay();
    const t = db.turnos.find((x) => x.dia === dow && x.inicio === inicio) || fallar('Ese horario no está en la grilla de la liga.');
    if (db.reservas.some((x) => x.partido_id === m.id && x.estado !== 'cancelada')) fallar('Este partido ya tiene un turno. Cancelalo antes de pedir otro.');
    let libre = null;
    for (let c = 1; c <= t.canchas; c++) if (!db.reservas.some((x) => x.fecha === fecha && x.inicio === inicio && x.cancha === c && x.estado !== 'cancelada')) { libre = c; break; }
    if (!libre) fallar('Ese turno se llenó. Elegí otro.');
    db.reservas.push({ id: ++db.ids.rid, partido_id: m.id, fecha, inicio, fin: t.fin, cancha: libre, estado: 'pendiente', creada_por: uid, creada_at: ahora() });
    log('turno_reservado', m.id, { fecha, inicio, cancha: libre }, uid);
    return fin();
  }
  function cancelarReserva(rid) {
    const r = db.reservas.find((x) => x.id === Number(rid) && x.estado !== 'cancelada') || fallar('Esa reserva no existe.');
    if (!esOrg()) {
      if (!miParejaEn(partido(r.partido_id))) fallar('Solo la cancelan los que juegan el partido.');
      if (r.estado === 'confirmada') fallar('El turno ya está confirmado: para cancelarlo hablá con el organizador.');
    }
    r.estado = 'cancelada';
    log('turno_cancelado', r.partido_id, { reserva: r.id });
    return fin();
  }
  function crearPareja(categoriaId) {
    const c = db.categorias.find((x) => x.id === Number(categoriaId)) || fallar('Esa categoría no existe.');
    if (!c.inscripcion_abierta) fallar(`La inscripción de ${c.nombre} está cerrada.`);
    const j = db.jugadores.find((x) => x.id === yo());
    if (j.genero && j.genero !== c.genero) fallar('Esa categoría es de otro género.');
    if (db.parejas.some((p) => p.categoria_id === c.id && p.estado === 'activa' && (p.jugador1 === yo() || p.jugador2 === yo()))) fallar('Ese jugador ya tiene pareja en esta categoría.');
    const codigo = Math.random().toString(36).slice(2, 8).toUpperCase();
    db.parejas.push({ id: ++db.ids.pid, categoria_id: c.id, jugador1: yo(), jugador2: null, estado: 'activa', codigo, creado_at: ahora() });
    log('pareja_creada', null, { pareja: db.ids.pid });
    fin();
    return codigo;
  }
  function unirmeAPareja(codigo) {
    const p = db.parejas.find((x) => x.codigo && x.codigo === String(codigo || '').trim().toUpperCase()) || fallar('Ese código no existe.');
    if (p.estado !== 'activa' || p.jugador2) fallar('Esa pareja ya está completa.');
    if (p.jugador1 === yo()) fallar('No podés ser tu propio compañero.');
    const c = db.categorias.find((x) => x.id === p.categoria_id);
    const j = db.jugadores.find((x) => x.id === yo());
    if (j.genero && j.genero !== c.genero) fallar('Esa categoría es de otro género.');
    if (db.parejas.some((x) => x.categoria_id === c.id && x.estado === 'activa' && (x.jugador1 === yo() || x.jugador2 === yo()))) fallar('Ese jugador ya tiene pareja en esta categoría.');
    p.jugador2 = yo(); delete p.codigo;
    log('pareja_completa', null, { pareja: p.id });
    return fin();
  }
  function actualizarPerfil(datos) {
    const j = db.jugadores.find((x) => x.id === yo());
    for (const k of ['nombre', 'apellido', 'telefono']) if (datos[k] != null) j[k] = String(datos[k]).slice(0, k === 'telefono' ? 30 : 60);
    return fin();
  }
  // --- organizador
  function fijarResultado(id, sets, wo = false, ganadorWo = null) {
    soloOrg();
    const m = partido(id);
    const antes = m.estado;
    let ganador;
    if (wo) {
      if (![m.a, m.b].includes(Number(ganadorWo))) fallar('Elegí quién gana por W.O.');
      ganador = Number(ganadorWo); sets = ganador === m.a ? SETS_WO.map((s) => [...s]) : SETS_WO.map(([x, y]) => [y, x]);
    } else { const v = validarSets(sets); if (!v.ok) fallar(v.error); sets = v.sets; ganador = v.ganador === 'a' ? m.a : m.b; }
    Object.assign(m, { estado: 'confirmado', sets, wo: !!wo, ganador, confirmado_por: yo(), confirmado_at: ahora(), confirmado_via: 'organizador', editado_por_org: true, cargado_at: m.cargado_at || ahora() });
    log('resultado_fijado_org', m.id, { sets, antes });
    return fin();
  }
  function anularResultado(id) {
    soloOrg();
    const m = partido(id);
    Object.assign(m, { estado: 'pendiente', sets: [], wo: false, ganador: null, cargado_por: null, cargado_pareja: null, cargado_at: null, vence_at: null,
      confirmado_por: null, confirmado_at: null, confirmado_via: null, disputa_motivo: null, disputa_sets: null, disputa_por: null, disputa_at: null });
    log('resultado_anulado', m.id);
    return fin();
  }
  function bajaPareja(pid) {
    soloOrg();
    const p = pareja(Number(pid)) || fallar('Esa pareja no existe.');
    p.estado = 'baja';
    let n = 0;
    for (const m of db.partidos) {
      if ((m.a === p.id || m.b === p.id) && m.estado !== 'confirmado') {
        const gana = m.a === p.id ? m.b : m.a;
        Object.assign(m, { estado: 'confirmado', wo: true, ganador: gana, sets: gana === m.a ? SETS_WO.map((s) => [...s]) : SETS_WO.map(([x, y]) => [y, x]),
          confirmado_por: yo(), confirmado_at: ahora(), confirmado_via: 'organizador', editado_por_org: true });
        for (const r of db.reservas) if (r.partido_id === m.id && r.estado !== 'cancelada') r.estado = 'cancelada';
        n++;
      }
    }
    log('pareja_baja', null, { pareja: p.id, wo: n });
    fin();
    return n;
  }
  function generarFixture(catId) {
    soloOrg();
    const c = Number(catId);
    const ids = db.parejas.filter((p) => p.categoria_id === c && p.estado === 'activa' && p.jugador2).map((p) => p.id).sort((x, y) => x - y);
    if (ids.length < 2) fallar('Hacen falta al menos 2 parejas completas.');
    if (db.partidos.some((m) => m.categoria_id === c && m.estado !== 'pendiente')) fallar('La categoría ya tiene resultados: no se puede rearmar el fixture.');
    const viejos = new Set(db.partidos.filter((m) => m.categoria_id === c).map((m) => m.id));
    db.partidos = db.partidos.filter((m) => !viejos.has(m.id));
    db.reservas = db.reservas.filter((r) => !viejos.has(r.partido_id));
    let total = 0;
    roundRobin(ids).forEach((ronda, i) => ronda.forEach(({ a, b }) => {
      db.partidos.push({ id: ++db.ids.mid, categoria_id: c, fecha: i + 1, a, b, estado: 'pendiente', sets: [], wo: false, ganador: null, cargado_por: null, cargado_pareja: null,
        cargado_at: null, vence_at: null, confirmado_por: null, confirmado_at: null, confirmado_via: null, disputa_motivo: null, disputa_sets: null, disputa_por: null, disputa_at: null, editado_por_org: false });
      total++;
    }));
    log('fixture_generado', null, { categoria: c, partidos: total });
    fin();
    return total;
  }
  function confirmarReserva(rid) {
    soloOrg();
    const r = db.reservas.find((x) => x.id === Number(rid) && x.estado === 'pendiente') || fallar('Esa reserva no está pendiente.');
    r.estado = 'confirmada';
    log('turno_confirmado', r.partido_id);
    return fin();
  }
  function guardarConfig(cambios) {
    soloOrg();
    for (const k of Object.keys(CONFIG_BASE)) {
      if (cambios[k] === undefined) continue;
      db.config[k] = typeof CONFIG_BASE[k] === 'number' ? Number(cambios[k]) : String(cambios[k]);
    }
    if (!(db.config.horas_autoconfirmar >= 1 && db.config.horas_autoconfirmar <= 168)) { db.config.horas_autoconfirmar = 24; fallar('Las horas para autoconfirmar van de 1 a 168.'); }
    log('config_cambiada', null, cambios);
    return fin();
  }
  function guardarTurno(t) {
    soloOrg();
    if (t.borrar) { db.turnos = db.turnos.filter((x) => x.id !== t.id); return fin(); }
    if (!/^\d\d:\d\d$/.test(t.inicio) || !/^\d\d:\d\d$/.test(t.fin)) fallar('Horario inválido (HH:MM).');
